<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Controlled 3D Particles</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 20, 0.6);
            --text-color: #ffffff;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: var(--text-color);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            padding: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        button.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        #video-element {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            z-index: 10;
            opacity: 0.8;
            transform: scaleX(-1);
            /* Mirror the video */
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: none;
            /* Hidden by default until loaded */
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            z-index: 9;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Initializing 3D Engine & AI...</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Hidden video for MediaPipe -->
    <video id="video-element" playsinline></video>
    <div id="status">Waiting for camera...</div>

    <div id="ui-container">
        <h1>Particle Shaper</h1>

        <div class="control-group">
            <label>Shape Template</label>
            <div class="btn-grid" id="shape-buttons">
                <button class="active" data-shape="sphere">Sphere</button>
                <button data-shape="heart">Heart</button>
                <button data-shape="flower">Flower</button>
                <button data-shape="saturn">Saturn</button>
                <button data-shape="buddha">Buddha</button>
                <button data-shape="fireworks">Fireworks</button>
            </div>
        </div>

        <div class="control-group">
            <label>Particle Color</label>
            <input type="color" id="color-picker" value="#00f3ff">
        </div>

        <div class="control-group">
            <label>Instructions</label>
            <div style="font-size: 0.8rem; color: #888; line-height: 1.4;">
                Show your hand to the camera.<br>
                • Open Hand: Expand Particles<br>
                • Closed Fist: Contract Particles
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- Configuration ---
        const PARTICLE_COUNT = 15000;
        const PARTICLE_SIZE = 0.05;
        const TRANSITION_SPEED = 0.05;

        // --- State ---
        let currentShape = 'sphere';
        let targetPositions = [];
        let particles;
        let geometry;
        let material;
        let scene, camera, renderer;
        let time = 0;
        let handTension = 0; // 0 = relaxed, 1 = tense/closed
        let targetScale = 1;
        let currentScale = 1;

        // --- Initialization ---
        function init() {
            // Scene Setup
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            // Add some fog for depth
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Particles Setup
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);

            // Initial positions (random sphere)
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const v = getRandomPointInSphere(2);
                positions[i * 3] = v.x;
                positions[i * 3 + 1] = v.y;
                positions[i * 3 + 2] = v.z;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Create a soft glow texture for particles
            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');

            material = new THREE.PointsMaterial({
                color: 0x00f3ff,
                size: PARTICLE_SIZE,
                map: sprite,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Initialize Target Positions
            generateTargetPositions('sphere');

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupUI();

            // Start Animation Loop
            animate();

            // Start Hand Tracking
            setupMediaPipe();
        }

        function setupUI() {
            const buttons = document.querySelectorAll('#shape-buttons button');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Update active state
                    buttons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    // Change shape
                    const shape = e.target.getAttribute('data-shape');
                    if (shape !== currentShape) {
                        currentShape = shape;
                        generateTargetPositions(shape);
                    }
                });
            });

            const colorPicker = document.getElementById('color-picker');
            colorPicker.addEventListener('input', (e) => {
                material.color.set(e.target.value);
            });
        }

        // --- Shape Generators ---

        function generateTargetPositions(shape) {
            const positions = [];
            const dummy = new THREE.Vector3();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p;
                switch (shape) {
                    case 'heart':
                        p = getHeartPoint();
                        break;
                    case 'flower':
                        p = getFlowerPoint();
                        break;
                    case 'saturn':
                        p = getSaturnPoint(i);
                        break;
                    case 'buddha':
                        p = getBuddhaPoint();
                        break;
                    case 'fireworks':
                        p = getFireworksPoint();
                        break;
                    case 'sphere':
                    default:
                        p = getRandomPointOnSphere(2);
                        break;
                }
                positions.push(p.x, p.y, p.z);
            }
            targetPositions = new Float32Array(positions);
        }

        // Helper Math Functions
        function getRandomPointInSphere(radius) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = Math.cbrt(Math.random()) * radius;
            const sinPhi = Math.sin(phi);
            return new THREE.Vector3(
                r * sinPhi * Math.cos(theta),
                r * sinPhi * Math.sin(theta),
                r * Math.cos(phi)
            );
        }

        function getRandomPointOnSphere(radius) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const sinPhi = Math.sin(phi);
            return new THREE.Vector3(
                radius * sinPhi * Math.cos(theta),
                radius * sinPhi * Math.sin(theta),
                radius * Math.cos(phi)
            );
        }

        function getHeartPoint() {
            // Heart surface equation approximation
            // x = 16sin^3(t)
            // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
            // Rotate to make 3D
            let x, y, z;
            // Rejection sampling for volume or surface
            // Let's do a parametric surface
            const t = Math.random() * Math.PI * 2;
            const u = Math.random() * Math.PI; // Z-depth distribution

            // 2D Heart curve
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

            // Add thickness
            const scale = 0.15;
            const zDepth = (Math.random() - 0.5) * 2 * (4 - Math.abs(hx) * 0.1); // Thicker in middle

            return new THREE.Vector3(hx * scale, hy * scale, zDepth * scale);
        }

        function getFlowerPoint() {
            // Rose curve: r = cos(k * theta)
            const k = 4; // 4 petals
            const theta = Math.random() * Math.PI * 2;
            const r = Math.cos(k * theta);
            const phi = (Math.random() - 0.5) * Math.PI; // Curvature

            // Add layers
            const layer = Math.floor(Math.random() * 3);
            const scale = 1.5 + layer * 0.5;

            const x = scale * r * Math.cos(theta) * Math.cos(phi);
            const y = scale * r * Math.sin(theta) * Math.cos(phi);
            const z = scale * Math.sin(phi);

            return new THREE.Vector3(x, y, z);
        }

        function getSaturnPoint(index) {
            // 70% Ring, 30% Sphere
            if (Math.random() > 0.3) {
                // Ring
                const inner = 2.5;
                const outer = 4.5;
                const angle = Math.random() * Math.PI * 2;
                const dist = inner + Math.random() * (outer - inner);
                return new THREE.Vector3(
                    Math.cos(angle) * dist,
                    Math.random() * 0.1, // Thin ring
                    Math.sin(angle) * dist
                ).applyAxisAngle(new THREE.Vector3(1, 0, 0), 0.4); // Tilt
            } else {
                // Planet
                return getRandomPointOnSphere(1.5);
            }
        }

        function getBuddhaPoint() {
            // Approximate Meditating Figure using primitives
            const r = Math.random();

            // Head (Sphere)
            if (r < 0.15) {
                const p = getRandomPointOnSphere(0.6);
                p.y += 1.8;
                return p;
            }
            // Torso (Cylinder/Oval)
            else if (r < 0.5) {
                const theta = Math.random() * Math.PI * 2;
                const h = Math.random() * 2.0; // Height
                const rad = 0.8 + Math.sin(h * Math.PI) * 0.2; // Taper
                return new THREE.Vector3(
                    Math.cos(theta) * rad,
                    h - 0.5,
                    Math.sin(theta) * rad * 0.8
                );
            }
            // Legs (Crossed - Torus segment approximation)
            else {
                const angle = Math.random() * Math.PI * 2;
                const rad = 1.5 + Math.random() * 0.5;
                const y = -0.5 + Math.random() * 0.6;
                return new THREE.Vector3(
                    Math.cos(angle) * rad,
                    y,
                    Math.sin(angle) * rad
                );
            }
        }

        function getFireworksPoint() {
            // Radial lines
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = Math.random() * 4;
            // Concentrate points on lines
            const lineJitter = 0.1;

            return new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
        }

        // --- Animation & Rendering ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 1. Update Particle Positions (Morphing)
            const positions = particles.geometry.attributes.position.array;

            // Calculate scale based on hand tension
            // If hand is closed (tension 1), scale down (contract)
            // If hand is open (tension 0), scale up (expand)
            // We smooth this value
            const targetS = 1.0 + (1.0 - handTension) * 1.5; // 1.0 to 2.5
            currentScale += (targetS - currentScale) * 0.1;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // Target pos
                const tx = targetPositions[ix];
                const ty = targetPositions[iy];
                const tz = targetPositions[iz];

                // Current pos
                let cx = positions[ix];
                let cy = positions[iy];
                let cz = positions[iz];

                // Lerp towards target
                cx += (tx - cx) * TRANSITION_SPEED;
                cy += (ty - cy) * TRANSITION_SPEED;
                cz += (tz - cz) * TRANSITION_SPEED;

                // Apply simple noise/movement
                const noise = 0.02;
                cx += (Math.random() - 0.5) * noise;
                cy += (Math.random() - 0.5) * noise;
                cz += (Math.random() - 0.5) * noise;

                // Save back
                positions[ix] = cx;
                positions[iy] = cy;
                positions[iz] = cz;
            }

            particles.geometry.attributes.position.needsUpdate = true;

            // 2. Apply Global Rotation & Scale
            particles.rotation.y = time * 0.1;
            particles.scale.setScalar(currentScale);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- MediaPipe Hand Tracking ---
        function setupMediaPipe() {
            const videoElement = document.getElementById('video-element');
            const statusElement = document.getElementById('status');
            const loadingOverlay = document.getElementById('loading-overlay');

            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            cameraUtils.start()
                .then(() => {
                    statusElement.innerText = "Camera active. Tracking hands...";
                    loadingOverlay.style.opacity = 0;
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                    videoElement.style.display = 'block';
                })
                .catch(err => {
                    console.error(err);
                    statusElement.innerText = "Camera failed: " + err.message;
                    loadingOverlay.innerHTML = "<div style='color:red'>Camera Access Denied or Error</div>";
                });
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Calculate tension for the first hand found
                const landmarks = results.multiHandLandmarks[0];

                // Simple tension metric: Average distance from fingertips to wrist (landmark 0)
                // Fingertips: 4 (Thumb), 8 (Index), 12 (Middle), 16 (Ring), 20 (Pinky)
                const wrist = landmarks[0];
                const tips = [4, 8, 12, 16, 20];

                let totalDist = 0;
                tips.forEach(idx => {
                    const tip = landmarks[idx];
                    const d = Math.sqrt(
                        Math.pow(tip.x - wrist.x, 2) +
                        Math.pow(tip.y - wrist.y, 2) +
                        Math.pow(tip.z - wrist.z, 2)
                    );
                    totalDist += d;
                });

                const avgDist = totalDist / 5;

                // Normalize: 
                // Open hand approx avgDist ~ 0.3 to 0.4
                // Closed fist approx avgDist ~ 0.1 to 0.15
                // We want Tension: 1 (Closed) -> 0 (Open)

                // Map 0.15 -> 1.0, 0.35 -> 0.0
                let t = (0.35 - avgDist) / (0.35 - 0.15);
                t = Math.max(0, Math.min(1, t)); // Clamp

                // Smooth update
                handTension += (t - handTension) * 0.2;

                document.getElementById('status').innerText = `Hand Detected. Tension: ${handTension.toFixed(2)}`;
            } else {
                // No hand, relax tension
                handTension += (0 - handTension) * 0.1;
                document.getElementById('status').innerText = "No hand detected. Idle.";
            }
        }

        // Start
        init();

    </script>
</body>

</html>
